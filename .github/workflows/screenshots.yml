name: Screenshots

# Manually triggered: renders each sketch in headless Chromium, captures a PNG,
# and opens a PR with the refreshed images and README.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: node scripts/screenshot.mjs

      - name: Open PR with refreshed screenshots
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            docs/screenshots/*.png
            README.md
          branch: screenshots/auto-update
          delete-branch: true
          commit-message: Refresh sketch screenshots
          title: Refresh sketch screenshots
          body: |
            Automated capture of each sketch via headless Chromium.

            Generated by the **Screenshots** workflow
            (`.github/workflows/screenshots.yml` / `scripts/screenshot.mjs`).
