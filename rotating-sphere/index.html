<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rotating Sphere</title>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }

      /* wrapper that stacks controls panel above the HUD bar */
      #overlay {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #eee;
        font-size: 1rem;
      }

      /* ── controls panel ── */
      #controls-panel {
        display: none;
        padding: 1rem 1.25rem;
        background: rgba(0, 0, 0, 0.82);
        backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      #controls-panel.open { display: block; }

      .ctrl-heading {
        font-weight: 600;
        margin-bottom: 0.9rem;
      }
      .ctrl-row {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        margin-bottom: 0.65rem;
      }
      .ctrl-label {
        min-width: 100px;
        color: #bbb;
        font-size: 0.9rem;
      }
      input[type="range"] {
        flex: 1;
        accent-color: #58a6ff;
        height: 2rem;   /* larger touch target */
        cursor: pointer;
      }
      .ctrl-value {
        min-width: 52px;
        text-align: right;
        color: #58a6ff;
        font-size: 0.9rem;
        font-variant-numeric: tabular-nums;
      }
      .axis-readout {
        margin-top: 0.4rem;
        color: #555;
        font-size: 0.85rem;
        font-family: monospace;
      }

      /* ── mini sphere preview ── */
      #mini-sphere-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
        padding-bottom: 1.1rem;
        margin-bottom: 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      #mini-sphere { display: block; }
      .mini-caption {
        color: #555;
        font-size: 0.75rem;
        font-family: monospace;
        text-align: center;
      }

      /* ── HUD bar ── */
      #hud {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        padding: 1rem 1.25rem;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(6px);
        border-top: 1px solid rgba(255, 255, 255, 0.07);
      }
      #hud a.back {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.6rem 1.25rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #eee;
        text-decoration: none;
        white-space: nowrap;
        flex-shrink: 0;
      }
      #hud a.back:hover { background: rgba(255, 255, 255, 0.2); }
      #hud button {
        padding: 0.6rem 1.25rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #eee;
        font-size: 1rem;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }
      #hud button:hover  { background: rgba(255, 255, 255, 0.2); }
      #hud button#gif-btn.recording {
        background: rgba(255, 80, 80, 0.18);
        border-color: rgba(255, 80, 80, 0.5);
        color: #f99;
      }
      #hud button.active {
        background: rgba(88, 166, 255, 0.18);
        border-color: rgba(88, 166, 255, 0.5);
      }
      .info-name { font-weight: 600; }
      .info-desc { color: #aaa; font-size: 0.9rem; margin-top: 0.25rem; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
  </head>
  <body>
    <script src="sketch.js"></script>

    <div id="overlay"
         onmouseenter="hudFocused=true"  onmouseleave="hudFocused=false"
         ontouchstart="hudFocused=true"  ontouchend="hudFocused=false">
      <div id="controls-panel">
        <div id="mini-sphere-wrap">
          <canvas id="mini-sphere" width="160" height="160"></canvas>
          <span class="mini-caption">rotation axis &nbsp;·&nbsp; grid shows UV warp</span>
        </div>

        <div class="ctrl-heading">Rotation axis</div>

        <div class="ctrl-row">
          <span class="ctrl-label">Polar (θ)</span>
          <input type="range" min="0" max="180" step="0.1" value="54.7"
            oninput="setAxisTheta(this.value);
                     document.getElementById('theta-val').textContent =
                       (+this.value).toFixed(1) + '°'">
          <span class="ctrl-value" id="theta-val">54.7°</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">Azimuth (φ)</span>
          <input type="range" min="0" max="360" step="0.1" value="45.0"
            oninput="setAxisPhi(this.value);
                     document.getElementById('phi-val').textContent =
                       (+this.value).toFixed(1) + '°'">
          <span class="ctrl-value" id="phi-val">45.0°</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">Speed</span>
          <input type="range" min="0" max="0.05" step="0.001" value="0.01"
            oninput="setRotSpeed(this.value);
                     document.getElementById('speed-val').textContent =
                       (+this.value).toFixed(3)">
          <span class="ctrl-value" id="speed-val">0.010</span>
        </div>

        <div class="ctrl-heading" style="margin-top:1rem;">Colour warp</div>

        <div class="ctrl-row">
          <span class="ctrl-label">Exponent (a)</span>
          <input type="range" min="0.1" max="5" step="0.05" value="1"
            oninput="setCoordExp(this.value);
                     document.getElementById('exp-val').textContent =
                       (+this.value).toFixed(2)">
          <span class="ctrl-value" id="exp-val">1.00</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">Imaginary (b)</span>
          <input type="range" min="-10" max="10" step="0.1" value="0"
            oninput="setCoordExpImag(this.value);
                     document.getElementById('expimag-val').textContent =
                       (+this.value).toFixed(1)">
          <span class="ctrl-value" id="expimag-val">0.0</span>
        </div>

        <div class="axis-readout">axis: (<span id="axis-display">0.577, 0.577, 0.577</span>)</div>
      </div>

      <div id="hud">
        <a class="back" href="../">&#8592; Index</a>
        <button id="mode-btn" onclick="toggle3D()">3D sphere</button>
        <button id="ctrl-btn" onclick="toggleControls()">&#9881; Controls</button>
        <button id="gif-btn" onclick="exportGif()">&#8595; GIF</button>
        <div>
          <div class="info-name">Rotating sphere</div>
          <div class="info-desc">UV-mapped unit sphere rotated by a Rodrigues matrix; move the cursor to spin faster.</div>
        </div>
      </div>
    </div>

    <script>
      function toggleControls() {
        const open = document.getElementById('controls-panel').classList.toggle('open');
        document.getElementById('ctrl-btn').classList.toggle('active', open);
        if (open) _miniKick();
      }

      // ── GIF export ────────────────────────────────────────────────────────

      let _gifWorkerURL = null;
      let _gifRecording = false;

      // Fetch the gif.js worker and pin it as a same-origin blob URL so the
      // Worker constructor succeeds without needing a local worker file.
      (async () => {
        try {
          const r = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');
          const t = await r.text();
          _gifWorkerURL = URL.createObjectURL(new Blob([t], { type: 'text/javascript' }));
        } catch (e) {
          console.warn('gif.js worker could not be loaded:', e);
        }
      })();

      function exportGif() {
        if (_gifRecording) return;
        if (typeof GIF === 'undefined') {
          alert('GIF library failed to load — check your connection and refresh.');
          return;
        }
        if (!_gifWorkerURL) {
          alert('GIF encoder is still initialising — please try again in a moment.');
          return;
        }

        _gifRecording = true;
        const btn = document.getElementById('gif-btn');
        btn.classList.add('recording');

        const TARGET_FPS   = 15;
        const DURATION     = 3;                              // seconds to capture
        const TOTAL_FRAMES = TARGET_FPS * DURATION;          // 45 frames
        const FRAME_DELAY  = Math.round(1000 / TARGET_FPS); // ms per frame (~67)
        const MAX_DIM      = 480;

        // Preserve canvas aspect ratio up to MAX_DIM on the longer side.
        const p5W = (typeof width  !== 'undefined') ? width  : window.innerWidth;
        const p5H = (typeof height !== 'undefined') ? height : window.innerHeight;
        let expW, expH;
        if (p5W >= p5H) { expW = MAX_DIM; expH = Math.round(MAX_DIM * p5H / p5W); }
        else             { expH = MAX_DIM; expW = Math.round(MAX_DIM * p5W / p5H); }

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width  = expW;
        exportCanvas.height = expH;
        const exportCtx = exportCanvas.getContext('2d');

        const gif = new GIF({
          workers: 2,
          quality: 10,
          width: expW,
          height: expH,
          workerScript: _gifWorkerURL,
          repeat: 0,
        });

        gif.on('progress', p => {
          btn.textContent = `Encoding… ${Math.round(p * 100)}%`;
        });

        gif.on('finished', blob => {
          const url = URL.createObjectURL(blob);
          const a   = document.createElement('a');
          a.href     = url;
          a.download = 'rotating-sphere.gif';
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          _gifRecording = false;
          btn.textContent = '↓ GIF';
          btn.classList.remove('recording');
        });

        const p5canvas = document.querySelector('canvas');
        let framesCaptured = 0;
        let rafCount = 0;
        // Capture every Nth rAF to hit ~TARGET_FPS (assumes ~60 Hz display).
        const SKIP = Math.max(1, Math.round(60 / TARGET_FPS));

        function captureLoop() {
          if (rafCount % SKIP === 0) {
            exportCtx.drawImage(p5canvas, 0, 0, expW, expH);
            gif.addFrame(exportCtx, { copy: true, delay: FRAME_DELAY });
            framesCaptured++;
            btn.textContent = `Recording… ${framesCaptured}/${TOTAL_FRAMES}`;
            if (framesCaptured >= TOTAL_FRAMES) {
              _gifAddParamSummary(exportCtx, gif, expW, expH);
              btn.textContent = 'Encoding…';
              gif.render();
              return;
            }
          }
          rafCount++;
          requestAnimationFrame(captureLoop);
        }

        requestAnimationFrame(captureLoop);
      }

      function _gifAddParamSummary(ctx, gif, w, h) {
        ctx.fillStyle = '#0d1117';
        ctx.fillRect(0, 0, w, h);

        // top accent bar
        const barH = Math.max(3, Math.round(h * 0.008));
        ctx.fillStyle = '#58a6ff';
        ctx.fillRect(0, 0, w, barH);

        const titleSz = Math.max(14, Math.round(w * 0.046));
        const labelSz = Math.max(10, Math.round(w * 0.030));
        const lineH   = Math.round(labelSz * 2.0);
        const px      = Math.round(w * 0.06);
        const valX    = px + Math.round(w * 0.40);
        let y = Math.round(h * 0.15);

        ctx.font      = `bold ${titleSz}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.fillStyle = '#e6edf3';
        ctx.fillText('Rotating Sphere', px, y);
        y += Math.round(titleSz * 0.55);

        ctx.fillStyle = '#30363d';
        ctx.fillRect(px, y, w - px * 2, 1);
        y += Math.round(lineH * 0.75);

        function row(label, value) {
          ctx.font      = `${labelSz}px monospace`;
          ctx.fillStyle = '#6e7681';
          ctx.fillText(label, px, y);
          ctx.fillStyle = '#58a6ff';
          ctx.fillText(value, valX, y);
          y += lineH;
        }

        const deg = r => (r * 180 / Math.PI).toFixed(1) + '°';

        row('mode',    (typeof mode3D       !== 'undefined') ? (mode3D ? '3D sphere' : 'flat map') : '—');
        row('axis θ', (typeof axisTheta !== 'undefined') ? deg(axisTheta) : '—');
        row('axis φ', (typeof axisPhi   !== 'undefined') ? deg(axisPhi)   : '—');
        row('speed',   (typeof rotSpeed     !== 'undefined') ? rotSpeed.toFixed(3) + ' rad/fr'    : '—');
        row('exp a',   (typeof coordExp     !== 'undefined') ? coordExp.toFixed(2)                 : '—');
        row('exp b',   (typeof coordExpImag !== 'undefined') ? coordExpImag.toFixed(1)             : '—');

        gif.addFrame(ctx, { copy: true, delay: 3000 }); // 3-second summary card
      }

      // ── Mini sphere preview ──────────────────────────────────────────────

      let _miniActive = false;

      function _miniKick() {
        if (_miniActive) return;
        _miniActive = true;
        requestAnimationFrame(_miniLoop);
      }

      function _miniLoop() {
        if (!document.getElementById('controls-panel').classList.contains('open')) {
          _miniActive = false;
          return;
        }
        _miniDraw();
        requestAnimationFrame(_miniLoop);
      }

      function _miniDraw() {
        const cv = document.getElementById('mini-sphere');
        if (!cv) return;
        const ctx = cv.getContext('2d');
        const W = cv.width, H = cv.height;
        const R = Math.min(W, H) * 0.43;
        const ox = W / 2, oy = H / 2;
        const invR = 1 / R;

        // Read live globals from sketch.js
        const tA   = (typeof axisTheta    !== 'undefined') ? axisTheta    : Math.acos(Math.sqrt(3) / 3);
        const pA   = (typeof axisPhi      !== 'undefined') ? axisPhi      : Math.PI / 4;
        const spd  = (typeof rotSpeed     !== 'undefined') ? rotSpeed     : 0.01;
        const a    = (typeof coordExp     !== 'undefined') ? coordExp     : 1;
        const b    = (typeof coordExpImag !== 'undefined') ? coordExpImag : 0;
        const ident = (a === 1 && b === 0);

        // Mirror the main sketch's rotation angle exactly
        const fc  = (typeof frameCount !== 'undefined') ? frameCount  : 0;
        const lmx = (typeof lastMouseX !== 'undefined') ? lastMouseX  : 0;
        const cw  = (typeof width      !== 'undefined') ? width       : window.innerWidth;
        const theta = fc * spd + 8 * Math.PI * lmx / cw;

        // Rotation axis vector
        const sinTA = Math.sin(tA);
        const rvx = sinTA * Math.cos(pA);
        const rvy = sinTA * Math.sin(pA);
        const rvz = Math.cos(tA);

        // Unscaled Rodrigues rotation matrix
        const cT = Math.cos(theta), sT = Math.sin(theta), oT = 1 - cT;
        const r00 = cT+rvx*rvx*oT,      r01 = rvx*rvy*oT-rvz*sT, r02 = rvx*rvz*oT+rvy*sT;
        const r10 = rvy*rvx*oT+rvz*sT,  r11 = cT+rvy*rvy*oT,     r12 = rvy*rvz*oT-rvx*sT;
        const r20 = rvz*rvx*oT-rvy*sT,  r21 = rvz*rvy*oT+rvx*sT, r22 = cT+rvz*rvz*oT;

        const idata = ctx.createImageData(W, H);
        const pxd   = idata.data;

        for (let j = 0; j < H; j++) {
          const rny  = (j - oy) * invR;
          const rny2 = rny * rny;
          for (let i = 0; i < W; i++) {
            const pi  = (j * W + i) << 2;
            const rnx = (i - ox) * invR;
            const d2  = rnx * rnx + rny2;
            if (d2 > 1) { pxd[pi + 3] = 0; continue; }

            const rnz = Math.sqrt(1 - d2);

            // Same warp as main sketch
            const nx = ident ? rnx : warpCoord(rnx, a, b);
            const ny = ident ? rny : warpCoord(rny, a, b);
            const nz = ident ? rnz : warpCoord(rnz, a, b);

            // Rotate
            const ex = r00*nx + r01*ny + r02*nz;
            const ey = r10*nx + r11*ny + r12*nz;
            const ez = r20*nx + r21*ny + r22*nz;

            // Normalise → lat/lon UV
            const len = Math.sqrt(ex*ex + ey*ey + ez*ez);
            if (len < 1e-4) { pxd[pi + 3] = 255; continue; }
            const ex_ = ex/len, ey_ = ey/len, ez_ = ez/len;

            const lat = Math.asin(Math.max(-1, Math.min(1, ez_)));
            const lon = Math.atan2(ey_, ex_);

            // 8 longitude × 4 latitude grid bands
            const uG = (lon / Math.PI + 1) * 4;
            const vG = (lat / (Math.PI / 2) + 1) * 2;
            const uF = uG - Math.floor(uG);
            const vF = vG - Math.floor(vG);
            const isGrid = uF < 0.08 || vF < 0.08;

            // Lambert shading from the viewer direction (+Z)
            const diff = 0.22 + 0.78 * rnz;
            let pr, pg, pb;
            if (isGrid) {
              pr = Math.round(88  * diff);
              pg = Math.round(166 * diff);
              pb = Math.round(255 * diff);
            } else {
              const tile = (Math.floor(uG) + Math.floor(vG)) & 1;
              pr = Math.round((tile ? 55 : 22) * diff);
              pg = Math.round((tile ? 65 : 28) * diff);
              pb = Math.round((tile ? 85 : 40) * diff);
            }
            pxd[pi] = pr; pxd[pi+1] = pg; pxd[pi+2] = pb; pxd[pi+3] = 255;
          }
        }

        ctx.putImageData(idata, 0, 0);

        // ── Rotation axis arrow ──────────────────────────────────────────
        const sc   = R * 1.18;
        const tipX = ox + rvx * sc, tipY = oy + rvy * sc;
        const tlX  = ox - rvx * sc, tlY  = oy - rvy * sc;

        ctx.save();

        // Dashed tail (negative half)
        ctx.strokeStyle = 'rgba(255,200,50,0.45)';
        ctx.lineWidth   = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(tlX, tlY); ctx.lineTo(ox, oy); ctx.stroke();

        // Solid shaft + arrowhead (positive half)
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(255,200,50,1)';
        ctx.lineWidth   = 2;
        ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(tipX, tipY); ctx.stroke();

        const ang = Math.atan2(tipY - oy, tipX - ox);
        const hl = 9, ha = 0.42;
        ctx.fillStyle = 'rgba(255,200,50,1)';
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(tipX - hl * Math.cos(ang - ha), tipY - hl * Math.sin(ang - ha));
        ctx.lineTo(tipX - hl * Math.cos(ang + ha), tipY - hl * Math.sin(ang + ha));
        ctx.closePath(); ctx.fill();

        // Centre dot
        ctx.fillStyle = 'rgba(255,200,50,0.8)';
        ctx.beginPath(); ctx.arc(ox, oy, 3, 0, Math.PI * 2); ctx.fill();

        // ── XYZ reference frame (bottom-right corner) ────────────────────
        // Matches the sketch's coordinate convention: X right, Y down, Z toward viewer.
        const fx = W - 26, fy = H - 26, fl = 13;
        ctx.font      = '9px monospace';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([]);

        ctx.strokeStyle = '#f87'; ctx.fillStyle = '#f87';
        ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx + fl, fy); ctx.stroke();
        ctx.fillText('x', fx + fl + 2, fy + 4);

        ctx.strokeStyle = '#8d8'; ctx.fillStyle = '#8d8';
        ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy + fl); ctx.stroke();
        ctx.fillText('y', fx - 10, fy + fl + 3);

        // Z as a dot-in-ring (pointing toward viewer, out of screen)
        ctx.strokeStyle = '#7cf'; ctx.fillStyle = '#7cf';
        ctx.beginPath(); ctx.arc(fx, fy, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(fx, fy, 5.5, 0, Math.PI * 2); ctx.stroke();
        ctx.fillText('z', fx - 13, fy - 8);

        ctx.restore();
      }
    </script>
  </body>
</html>
