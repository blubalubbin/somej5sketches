<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rotating Sphere</title>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }

      /* wrapper that stacks controls panel above the HUD bar */
      #overlay {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #eee;
        font-size: 1rem;
      }

      /* ── controls panel ── */
      #controls-panel {
        display: none;
        padding: 1rem 1.25rem;
        background: rgba(0, 0, 0, 0.82);
        backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      #controls-panel.open { display: block; }

      .ctrl-heading {
        font-weight: 600;
        margin-bottom: 0.9rem;
      }
      .ctrl-row {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        margin-bottom: 0.65rem;
      }
      .ctrl-label {
        min-width: 100px;
        color: #bbb;
        font-size: 0.9rem;
      }
      input[type="range"] {
        flex: 1;
        accent-color: #58a6ff;
        height: 2rem;   /* larger touch target */
        cursor: pointer;
      }
      .ctrl-value {
        min-width: 52px;
        text-align: right;
        color: #58a6ff;
        font-size: 0.9rem;
        font-variant-numeric: tabular-nums;
      }
      .axis-readout {
        margin-top: 0.4rem;
        color: #555;
        font-size: 0.85rem;
        font-family: monospace;
      }

      /* ── HUD bar ── */
      #hud {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        padding: 1rem 1.25rem;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(6px);
        border-top: 1px solid rgba(255, 255, 255, 0.07);
      }
      #hud a.back {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.6rem 1.25rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #eee;
        text-decoration: none;
        white-space: nowrap;
        flex-shrink: 0;
      }
      #hud a.back:hover { background: rgba(255, 255, 255, 0.2); }
      #hud button {
        padding: 0.6rem 1.25rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #eee;
        font-size: 1rem;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }
      #hud button:hover  { background: rgba(255, 255, 255, 0.2); }
      #hud button#gif-btn.recording {
        background: rgba(255, 80, 80, 0.18);
        border-color: rgba(255, 80, 80, 0.5);
        color: #f99;
      }
      #hud button.active {
        background: rgba(88, 166, 255, 0.18);
        border-color: rgba(88, 166, 255, 0.5);
      }
      .info-name { font-weight: 600; }
      .info-desc { color: #aaa; font-size: 0.9rem; margin-top: 0.25rem; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
  </head>
  <body>
    <script src="sketch.js"></script>

    <div id="overlay"
         onmouseenter="hudFocused=true"  onmouseleave="hudFocused=false"
         ontouchstart="hudFocused=true"  ontouchend="hudFocused=false">
      <div id="controls-panel">
        <div class="ctrl-heading">Rotation axis</div>

        <div class="ctrl-row">
          <span class="ctrl-label">Polar (θ)</span>
          <input type="range" min="0" max="180" step="0.1" value="54.7"
            oninput="setAxisTheta(this.value);
                     document.getElementById('theta-val').textContent =
                       (+this.value).toFixed(1) + '°'">
          <span class="ctrl-value" id="theta-val">54.7°</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">Azimuth (φ)</span>
          <input type="range" min="0" max="360" step="0.1" value="45.0"
            oninput="setAxisPhi(this.value);
                     document.getElementById('phi-val').textContent =
                       (+this.value).toFixed(1) + '°'">
          <span class="ctrl-value" id="phi-val">45.0°</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">Speed</span>
          <input type="range" min="0" max="0.05" step="0.001" value="0.01"
            oninput="setRotSpeed(this.value);
                     document.getElementById('speed-val').textContent =
                       (+this.value).toFixed(3)">
          <span class="ctrl-value" id="speed-val">0.010</span>
        </div>

        <div class="ctrl-heading" style="margin-top:1rem;">Colour warp</div>

        <div class="ctrl-row">
          <span class="ctrl-label">Exponent (a)</span>
          <input type="range" min="0.1" max="5" step="0.05" value="1"
            oninput="setCoordExp(this.value);
                     document.getElementById('exp-val').textContent =
                       (+this.value).toFixed(2)">
          <span class="ctrl-value" id="exp-val">1.00</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">Imaginary (b)</span>
          <input type="range" min="-10" max="10" step="0.1" value="0"
            oninput="setCoordExpImag(this.value);
                     document.getElementById('expimag-val').textContent =
                       (+this.value).toFixed(1)">
          <span class="ctrl-value" id="expimag-val">0.0</span>
        </div>

        <div class="axis-readout">axis: (<span id="axis-display">0.577, 0.577, 0.577</span>)</div>
      </div>

      <div id="hud">
        <a class="back" href="../">&#8592; Index</a>
        <button id="mode-btn" onclick="toggle3D()">3D sphere</button>
        <button id="ctrl-btn" onclick="toggleControls()">&#9881; Controls</button>
        <button id="gif-btn" onclick="exportGif()">&#8595; GIF</button>
        <div>
          <div class="info-name">Rotating sphere</div>
          <div class="info-desc">UV-mapped unit sphere rotated by a Rodrigues matrix; move the cursor to spin faster.</div>
        </div>
      </div>
    </div>

    <script>
      function toggleControls() {
        const open = document.getElementById('controls-panel').classList.toggle('open');
        document.getElementById('ctrl-btn').classList.toggle('active', open);
      }

      // ── GIF export ────────────────────────────────────────────────────────

      let _gifWorkerURL = null;
      let _gifRecording = false;

      // Fetch the gif.js worker and pin it as a same-origin blob URL so the
      // Worker constructor succeeds without needing a local worker file.
      (async () => {
        try {
          const r = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');
          const t = await r.text();
          _gifWorkerURL = URL.createObjectURL(new Blob([t], { type: 'text/javascript' }));
        } catch (e) {
          console.warn('gif.js worker could not be loaded:', e);
        }
      })();

      function exportGif() {
        if (_gifRecording) return;
        if (typeof GIF === 'undefined') {
          alert('GIF library failed to load — check your connection and refresh.');
          return;
        }
        if (!_gifWorkerURL) {
          alert('GIF encoder is still initialising — please try again in a moment.');
          return;
        }

        _gifRecording = true;
        const btn = document.getElementById('gif-btn');
        btn.classList.add('recording');

        const TARGET_FPS   = 15;
        const DURATION     = 3;                              // seconds to capture
        const TOTAL_FRAMES = TARGET_FPS * DURATION;          // 45 frames
        const FRAME_DELAY  = Math.round(1000 / TARGET_FPS); // ms per frame (~67)
        const MAX_DIM      = 480;

        // Preserve canvas aspect ratio up to MAX_DIM on the longer side.
        const p5W = (typeof width  !== 'undefined') ? width  : window.innerWidth;
        const p5H = (typeof height !== 'undefined') ? height : window.innerHeight;
        let expW, expH;
        if (p5W >= p5H) { expW = MAX_DIM; expH = Math.round(MAX_DIM * p5H / p5W); }
        else             { expH = MAX_DIM; expW = Math.round(MAX_DIM * p5W / p5H); }

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width  = expW;
        exportCanvas.height = expH;
        const exportCtx = exportCanvas.getContext('2d');

        const gif = new GIF({
          workers: 2,
          quality: 10,
          width: expW,
          height: expH,
          workerScript: _gifWorkerURL,
          repeat: 0,
        });

        gif.on('progress', p => {
          btn.textContent = `Encoding… ${Math.round(p * 100)}%`;
        });

        gif.on('finished', blob => {
          const url = URL.createObjectURL(blob);
          const a   = document.createElement('a');
          a.href     = url;
          a.download = 'rotating-sphere.gif';
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          _gifRecording = false;
          btn.textContent = '↓ GIF';
          btn.classList.remove('recording');
        });

        const p5canvas = document.querySelector('canvas');
        let framesCaptured = 0;
        let rafCount = 0;
        // Capture every Nth rAF to hit ~TARGET_FPS (assumes ~60 Hz display).
        const SKIP = Math.max(1, Math.round(60 / TARGET_FPS));

        function captureLoop() {
          if (rafCount % SKIP === 0) {
            exportCtx.drawImage(p5canvas, 0, 0, expW, expH);
            gif.addFrame(exportCtx, { copy: true, delay: FRAME_DELAY });
            framesCaptured++;
            btn.textContent = `Recording… ${framesCaptured}/${TOTAL_FRAMES}`;
            if (framesCaptured >= TOTAL_FRAMES) {
              _gifAddParamSummary(exportCtx, gif, expW, expH);
              btn.textContent = 'Encoding…';
              gif.render();
              return;
            }
          }
          rafCount++;
          requestAnimationFrame(captureLoop);
        }

        requestAnimationFrame(captureLoop);
      }

      function _gifAddParamSummary(ctx, gif, w, h) {
        ctx.fillStyle = '#0d1117';
        ctx.fillRect(0, 0, w, h);

        // top accent bar
        const barH = Math.max(3, Math.round(h * 0.008));
        ctx.fillStyle = '#58a6ff';
        ctx.fillRect(0, 0, w, barH);

        const titleSz = Math.max(14, Math.round(w * 0.046));
        const labelSz = Math.max(10, Math.round(w * 0.030));
        const lineH   = Math.round(labelSz * 2.0);
        const px      = Math.round(w * 0.06);
        const valX    = px + Math.round(w * 0.40);
        let y = Math.round(h * 0.15);

        ctx.font      = `bold ${titleSz}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.fillStyle = '#e6edf3';
        ctx.fillText('Rotating Sphere', px, y);
        y += Math.round(titleSz * 0.55);

        ctx.fillStyle = '#30363d';
        ctx.fillRect(px, y, w - px * 2, 1);
        y += Math.round(lineH * 0.75);

        function row(label, value) {
          ctx.font      = `${labelSz}px monospace`;
          ctx.fillStyle = '#6e7681';
          ctx.fillText(label, px, y);
          ctx.fillStyle = '#58a6ff';
          ctx.fillText(value, valX, y);
          y += lineH;
        }

        const deg = r => (r * 180 / Math.PI).toFixed(1) + '°';

        row('mode',    (typeof mode3D       !== 'undefined') ? (mode3D ? '3D sphere' : 'flat map') : '—');
        row('axis θ', (typeof axisTheta !== 'undefined') ? deg(axisTheta) : '—');
        row('axis φ', (typeof axisPhi   !== 'undefined') ? deg(axisPhi)   : '—');
        row('speed',   (typeof rotSpeed     !== 'undefined') ? rotSpeed.toFixed(3) + ' rad/fr'    : '—');
        row('exp a',   (typeof coordExp     !== 'undefined') ? coordExp.toFixed(2)                 : '—');
        row('exp b',   (typeof coordExpImag !== 'undefined') ? coordExpImag.toFixed(1)             : '—');

        gif.addFrame(ctx, { copy: true, delay: 3000 }); // 3-second summary card
      }
    </script>
  </body>
</html>
