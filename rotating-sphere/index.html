<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rotating Sphere</title>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      #hud {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.6rem 1rem;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(6px);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        color: #eee;
        font-size: 0.85rem;
        z-index: 10;
      }
      #hud a.back {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.3rem 0.75rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 5px;
        color: #eee;
        text-decoration: none;
        white-space: nowrap;
        flex-shrink: 0;
      }
      #hud a.back:hover { background: rgba(255, 255, 255, 0.2); }
      #hud button {
        padding: 0.3rem 0.75rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 5px;
        color: #eee;
        font-size: 0.85rem;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }
      #hud button:hover { background: rgba(255, 255, 255, 0.2); }
      .info-name { font-weight: 600; }
      .info-desc { color: #aaa; font-size: 0.8rem; margin-top: 0.1rem; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  </head>
  <body>
    <script src="sketch.js"></script>
    <div id="hud">
      <a class="back" href="../">&#8592; Index</a>
      <button id="mode-btn" onclick="toggle3D()">3D sphere</button>
      <div>
        <div class="info-name">Rotating sphere</div>
        <div class="info-desc">UV-mapped unit sphere rotated by a Rodrigues matrix; move the cursor to spin faster.</div>
      </div>
    </div>
  </body>
</html>
